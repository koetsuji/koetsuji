<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f7f5"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>

    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d7d4ff" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#d7d4ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9c7" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ffd9c7" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#111827" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="34" fill="url(#bg)"/>

  <circle cx="190" cy="70" r="155" fill="url(#orb1)" filter="url(#blur)">
    <animate attributeName="cx" values="190;260;190" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1010" cy="300" r="185" fill="url(#orb2)" filter="url(#blur)">
    <animate attributeName="cy" values="300;230;300" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)">
    <rect x="48" y="42" width="1104" height="256" rx="28" fill="#ffffff" fill-opacity=".76" stroke="#111827" stroke-opacity=".08"/>
  </g>

  <text x="92" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif"
        font-size="20" font-weight="600" fill="#6b7280" letter-spacing="2.4">
    K O E T S U J I
  </text>

  <text x="92" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif"
        font-size="54" font-weight="700" fill="#111827">
    Systems. Cloud. Security.
  </text>

  <text x="92" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif"
        font-size="23" font-weight="400" fill="#4b5563">
    Building practical infrastructure tools, labs and small experiments.
  </text>

  <g transform="translate(92 252)">
    <circle cx="8" cy="8" r="8" fill="#22c55e"/>
    <text x="27" y="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif"
          font-size="17" font-weight="500" fill="#374151">
      currently shipping things
    </text>
  </g>
</svg>
