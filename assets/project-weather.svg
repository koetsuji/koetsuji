<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
<style>
  .mono { font-family: "Google Sans Code", "JetBrains Mono", "Cascadia Code", "Cascadia Mono", "IBM Plex Mono", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-feature-settings:"liga" 1,"calt" 1; font-variant-ligatures: contextual common-ligatures; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .panel { fill:#fbfbf9; stroke:#e5e6df; }
  .text { fill:#171816; }
  .muted { fill:#777a73; }
  .faint { fill:#a7aaa3; }
  .line { stroke:#e5e6df; }
  .accent { fill:#7e9588; }
  .accent-stroke { stroke:#7e9588; }
  @media (prefers-color-scheme: dark) {
    .panel { fill:#111412; stroke:#282c28; }
    .text { fill:#f1f2ed; }
    .muted { fill:#a3a69f; }
    .faint { fill:#6d716b; }
    .line { stroke:#292d29; }
    .accent { fill:#9ab2a5; }
    .accent-stroke { stroke:#9ab2a5; }
  }
</style>

<rect x="8" y="8" width="1184" height="204" rx="18" class="panel"/>

<text x="34" y="42" class="mono faint" font-size="12">03</text>
<text x="34" y="89" class="mono text" font-size="25" font-weight="600">Weather App</text>
<text x="34" y="119" class="sans muted" font-size="14">A small, quiet interface for checking the weather.</text>
<text x="34" y="172" class="mono text" font-size="14">open repository ↗</text>

<!-- weather visualization -->
<g transform="translate(540,56)">
  <line x1="0" y1="90" x2="610" y2="90" class="line" stroke-width="1"/>
  <path d="M0 72 C90 82, 120 30, 205 46 S340 96, 418 61 S520 20, 610 42"
        fill="none" class="accent-stroke" stroke-width="2.2" stroke-linecap="round"/>
  <circle r="4" class="accent">
    <animateMotion dur="9s" repeatCount="indefinite"
      path="M0 72 C90 82, 120 30, 205 46 S340 96, 418 61 S520 20, 610 42"/>
  </circle>

  <text x="0" y="126" class="mono faint" font-size="10">now</text>
  <text x="610" y="126" text-anchor="end" class="mono faint" font-size="10">later</text>
</g>
</svg>