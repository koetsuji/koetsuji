<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="286" viewBox="0 0 1200 286">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }

  .panel { fill:#fbfbfa; stroke:#e8e8e4; }
  .text { fill:#20201e; }
  .muted { fill:#777772; }
  .faint { fill:#aaa9a3; }
  .hair { stroke:#e7e7e2; }
  .accent { fill:#74829a; }
  .accent-stroke { stroke:#74829a; }

  @media (prefers-color-scheme: dark) {
    .panel { fill:#101214; stroke:#2a2d31; }
    .text { fill:#f2f2ef; }
    .muted { fill:#999d9f; }
    .faint { fill:#6f7477; }
    .hair { stroke:#272a2e; }
    .accent { fill:#95a4bd; }
    .accent-stroke { stroke:#95a4bd; }
  }
</style>

<rect x="22" y="22" width="1156" height="242" rx="20" class="panel"/>

<!-- top rail -->
<text x="58" y="66" class="mono faint" font-size="14">~/koetsuji</text>
<line x1="58" y1="84" x2="1142" y2="84" class="hair" stroke-width="1"/>

<!-- identity -->
<text x="58" y="132" class="mono text" font-size="17" font-weight="600" letter-spacing="1.2">AGAH CELEN</text>

<!-- main line -->
<text x="58" y="184" class="mono text" font-size="42" font-weight="600" letter-spacing="-1.4">
  systems / networks / security
</text>

<!-- copy -->
<text x="58" y="221" class="sans muted" font-size="18">
  hybrid infrastructure, identity, automation — and small tools I actually use.
</text>

<!-- right-side tiny console detail -->
<g transform="translate(944 112)">
  <text x="0" y="0" class="mono faint" font-size="12">status</text>
  <circle cx="4" cy="29" r="4" class="accent">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="18" y="34" class="mono muted" font-size="13">building</text>

  <text x="0" y="73" class="mono faint" font-size="12">focus</text>
  <text x="0" y="101" class="mono muted" font-size="13">infra + security</text>
</g>

<!-- understated blinking cursor -->
<rect x="727" y="159" width="11" height="29" rx="1.5" class="accent" opacity=".72">
  <animate attributeName="opacity"
           values=".72;.72;.12;.12;.72"
           keyTimes="0;0.44;0.45;0.82;1"
           dur="1.65s"
           repeatCount="indefinite"/>
</rect>
</svg>