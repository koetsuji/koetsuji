<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
<style>
  .mono { font-family: "Google Sans Code", "JetBrains Mono", "Cascadia Code", "Cascadia Mono", "IBM Plex Mono", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-feature-settings:"liga" 1,"calt" 1; font-variant-ligatures: contextual common-ligatures; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .panel { fill:#fbfbf9; stroke:#e5e6df; }
  .text { fill:#171816; }
  .muted { fill:#777a73; }
  .faint { fill:#a7aaa3; }
  .line { stroke:#e5e6df; }
  .accent { fill:#7d8da8; }
  .accent2 { fill:#aab6c8; }
  @media (prefers-color-scheme: dark) {
    .panel { fill:#111412; stroke:#282c28; }
    .text { fill:#f1f2ed; }
    .muted { fill:#a3a69f; }
    .faint { fill:#6d716b; }
    .line { stroke:#292d29; }
    .accent { fill:#9babc7; }
    .accent2 { fill:#68758a; }
  }
</style>

<rect x="8" y="8" width="684" height="284" rx="18" class="panel"/>
<text x="34" y="42" class="mono faint" font-size="12">01 / featured</text>

<text x="34" y="96" class="mono text" font-size="27" font-weight="600">Windows Battery Report</text>
<text x="34" y="126" class="sans muted" font-size="15">A cleaner battery-health report for Windows.</text>

<!-- battery glyph -->
<g transform="translate(34,168)">
  <rect x="0" y="0" width="330" height="66" rx="12" fill="none" class="line" stroke-width="2"/>
  <rect x="330" y="19" width="10" height="28" rx="3" class="accent2"/>
  <rect x="9" y="9" width="244" height="48" rx="7" class="accent" opacity=".78">
    <animate attributeName="width" values="205;244;232;244" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="165" y="41" text-anchor="middle" class="mono text" font-size="13" font-weight="600">health report</text>
</g>

<line x1="414" y1="62" x2="414" y2="250" class="line" stroke-width="1"/>

<text x="446" y="91" class="mono faint" font-size="11">stack</text>
<text x="446" y="116" class="mono muted" font-size="13">PowerShell</text>

<text x="446" y="162" class="mono faint" font-size="11">why</text>
<text x="446" y="187" class="mono muted" font-size="13">useful > pretty</text>

<text x="446" y="233" class="mono text" font-size="14">open repository ↗</text>
</svg>