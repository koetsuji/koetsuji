<svg xmlns="http://www.w3.org/2000/svg" width="470" height="300" viewBox="0 0 470 300">
<style>
  .mono { font-family: "Google Sans Code", "JetBrains Mono", "Cascadia Code", "Cascadia Mono", "IBM Plex Mono", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-feature-settings:"liga" 1,"calt" 1; font-variant-ligatures: contextual common-ligatures; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .panel { fill:#fbfbf9; stroke:#e5e6df; }
  .text { fill:#171816; }
  .muted { fill:#777a73; }
  .faint { fill:#a7aaa3; }
  .line { stroke:#e5e6df; }
  .accent { fill:#9a8178; }
  .accent-stroke { stroke:#9a8178; }
  @media (prefers-color-scheme: dark) {
    .panel { fill:#111412; stroke:#282c28; }
    .text { fill:#f1f2ed; }
    .muted { fill:#a3a69f; }
    .faint { fill:#6d716b; }
    .line { stroke:#292d29; }
    .accent { fill:#b59b92; }
    .accent-stroke { stroke:#b59b92; }
  }
</style>

<rect x="8" y="8" width="454" height="284" rx="18" class="panel"/>
<text x="30" y="42" class="mono faint" font-size="12">02</text>

<text x="30" y="88" class="mono text" font-size="24" font-weight="600">Palo Rules Game</text>
<text x="30" y="117" class="sans muted" font-size="14">DNAT / SNAT, made visual.</text>

<!-- packet path -->
<g transform="translate(30,156)">
  <text x="0" y="10" class="mono faint" font-size="10">src</text>
  <text x="312" y="10" class="mono faint" font-size="10">dst</text>
  <line x1="32" y1="6" x2="300" y2="6" class="line" stroke-width="2"/>
  <circle cx="32" cy="6" r="7" class="panel"/>
  <circle cx="300" cy="6" r="7" class="panel"/>
  <circle r="4" class="accent">
    <animateMotion dur="5.4s" repeatCount="indefinite" path="M32,6 L300,6"/>
    <animate attributeName="opacity" values=".35;1;.35" dur="2.7s" repeatCount="indefinite"/>
  </circle>

  <text x="0" y="63" class="mono muted" font-size="12">if / then / translate</text>
  <text x="0" y="100" class="mono text" font-size="14">open repository ↗</text>
</g>
</svg>